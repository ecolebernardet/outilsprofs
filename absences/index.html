<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" onerror="console.error('❌ Échec jsPDF')"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js" onerror="console.error('❌ Échec jsPDF-autotable')"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="console.error('❌ Échec Supabase SDK')"></script>
    <title>Suivi Absences - École Collaboratif</title>
<style>
    :root {
        --absent: #e74c3c;
        --excuse: #f1c40f;
        --dark: #2c3e50;
        --light: #f4f7f6;
        --blue: #3498db;
        --success: #27ae60;
        --gray: #95a5a6;
    }

    * { box-sizing: border-box; }

    body {
        font-family: 'Segoe UI', Roboto, sans-serif;
        background: var(--light);
        font-size: 11px;
        margin: 10px;
        color: #333;

    }

    .container {
        background: white;
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        width: 98vw;
        margin: auto;
        overflow-x: auto;
    }

    .top-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
        align-items: center;
        background: #f8f9fa;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #eee;
        flex-wrap: wrap;
    }

    table { border-collapse: collapse; width: 100%; table-layout: fixed; background: white; }
    th, td { border: 1px solid #e0e0e0; padding: 2px; text-align: center; overflow: hidden; height: 32px; }

    .month-header {
        background: var(--dark); color: white; cursor: pointer;
        font-size: 12px; transition: 0.3s; font-weight: 500;
    }
    .month-header:hover { background: var(--blue); }
    .month-header.active { background: var(--blue); font-weight: bold; }

    .day-group-header {
        font-size: 10px; background: #ecf0f1; font-weight: bold;
        cursor: pointer; color: #7f8c8d; padding: 2px 1px; line-height: 1.2;
        border-left: 3px solid #4a6278 !important;
        border-right: 3px solid #4a6278 !important;
    }
    .day-group-header:hover { background: var(--blue); color: white; }

    .half-day-col {
        width: 18px; font-size: 9px; background: #f5f6fa;
        font-weight: bold; color: #aaa; padding: 1px; line-height: 1.2;
    }
    .half-day-col.today-highlight { background: #eef7ff !important; box-shadow: inset 0 0 0 1.5px var(--blue) !important; }

    .day-start { border-left: 3px solid #4a6278 !important; }
    .day-end   { border-right: 3px solid #4a6278 !important; }
    .half-day-col.day-start { border-left: 3px solid #4a6278 !important; }
    .half-day-col.day-end   { border-right: 3px solid #4a6278 !important; }
    #tableBody tr:last-child td.day-start { border-left: 3px solid #4a6278 !important; }
    #tableBody tr:last-child td.day-end   { border-right: 3px solid #4a6278 !important; }

    .col-main {
        width: 300px; min-width: 300px; text-align: left; padding-left: 12px;
        background: #fff; position: sticky; left: 0; z-index: 10; border-right: 2px solid #ddd;
    }

    .class-row { background: #d8dfe6; font-weight: bold; }
    .class-row td { height: 45px; border: 1px solid #b0bbc7 !important; }
    .class-row td.day-start { border-left: 3px solid #4a6278 !important; }
    .class-row td.day-end   { border-right: 3px solid #4a6278 !important; }
    .class-name-container {
        display: flex; align-items: center; justify-content: space-between;
        width: 100%; padding: 5px 0; font-size: 13px;
    }

    .drag-handle { cursor: grab; color: #bdc3c7; padding-right: 8px; font-size: 13px; }
    .drag-handle-class { cursor: grab; color: var(--blue); padding-right: 10px; font-size: 13px; user-select: none; }
    .drag-over { border-top: 3px solid var(--blue) !important; }

    .cell-abs { cursor: pointer; font-weight: bold; transition: 0.1s; font-size: 10px; padding: 1px; }
    .st-none { background: #fff; color: transparent; }
    .st-A   { background: var(--absent) !important; color: white !important; }
    .st-Exc { background: var(--excuse) !important; color: black !important; }

    .today-highlight { background: #eef7ff !important; box-shadow: inset 0 0 0 1.5px var(--blue) !important; }
    .st-A.today-highlight   { background: var(--absent) !important; color: white !important; }
    .st-Exc.today-highlight { background: var(--excuse) !important; color: black !important; }

    #tableBody tr:not(.class-row):hover td { background: #f0f4f8 !important; }
    #tableBody tr:not(.class-row):hover td.st-A   { background: var(--absent) !important; }
    #tableBody tr:not(.class-row):hover td.st-Exc { background: var(--excuse) !important; }
    #tableBody tr:not(.class-row):hover td.today-highlight { background: #d6eaf8 !important; }
    #tableBody tr:not(.class-row):hover td.st-A.today-highlight   { background: var(--absent) !important; }
    #tableBody tr:not(.class-row):hover td.st-Exc.today-highlight { background: var(--excuse) !important; }

    .btn-main {
        border: none; padding: 5px; border-radius: 6px; cursor: pointer;
        color: white; font-weight: 600; font-size: 10px; transition: 0.2s;
        display: inline-flex; align-items: center; justify-content: center;
        text-align: center; gap: 5px; line-height: 1.1;
        width: 80px; height: 40px; white-space: normal; flex-shrink: 0;
    }
    .btn-main:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-del { background: none; border: none; color: #bdc3c7; cursor: pointer; font-size: 14px; padding: 4px; }

    .input-group { position: relative; display: inline-flex; align-items: center; }
    .input-group input {
        padding: 8px 30px 8px 10px; border-radius: 6px;
        border: 1px solid #ddd; outline: none; width: 200px;
    }
    .btn-add-inline { position: absolute; right: 5px; background: none; border: none; color: var(--dark); font-weight: bold; font-size: 18px; cursor: pointer; }

    .stats-badge { font-size: 9px; background: white; padding: 2px 8px; border-radius: 12px; border: 1px solid #dcdde1; color: #2f3640; margin-left: auto; margin-right: 8px; }
    .stats-footer { margin-top: 20px; padding: 15px; background: var(--dark); color: white; border-radius: 10px; display: flex; gap: 20px; justify-content: center; font-size: 13px; }
    .sync-status { font-size: 10px; color: #95a5a6; font-style: italic; white-space: nowrap; }

    .dropdown { position: relative; display: inline-flex; }
    .dropdown-content {
        display: none; position: absolute; top: 100%; left: 0;
        background-color: white; min-width: 210px;
        box-shadow: 0px 8px 16px rgba(0,0,0,0.15);
        z-index: 10000; border-radius: 8px; border: 1px solid #ddd; margin-top: 5px;
    }
    #gestionMenu { min-width: 300px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); padding: 8px 0; }
    #gestionMenu a { font-size: 16px; padding: 14px 22px; white-space: nowrap; }
    #gestionMenu a i { font-size: 18px; width: 25px; text-align: center; }
    #gestionMenu a:hover { background-color: var(--blue) !important; color: white !important; text-decoration: none; }
    #gestionMenu a:hover i { color: white !important; }
    #gestionMenu a[style*="color:var(--absent)"]:hover { background-color: var(--absent) !important; color: white !important; }
    .dropdown-content.show { display: block !important; }
    .dropdown-content a {
        width: 100%; text-align: left; text-decoration: none; padding: 12px 15px;
        font-size: 11px; display: flex; align-items: center; gap: 10px;
        color: var(--dark); border-bottom: 1px solid #f9f9f9;
    }
    .show { display: block; }

    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(44,62,80,0.7); display: none; align-items: center;
        justify-content: center; z-index: 2000; backdrop-filter: blur(4px); padding: 16px;
    }
    .modal {
        background: white; border-radius: 16px; max-width: 560px; width: 100%;
        max-height: calc(100vh - 32px); display: flex; flex-direction: column;
        animation: modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1); overflow: hidden;
    }
    .modal h2 { padding: 20px 22px 14px; margin: 0; font-size: 15px; border-bottom: 1px solid #eee; flex-shrink: 0; }
    .modal-content { overflow-y: auto; padding: 16px 22px; flex: 1; }
    .modal-buttons { padding: 14px 22px; border-top: 1px solid #f0f0f0; display: flex; gap: 8px; justify-content: flex-end; flex-shrink: 0; background: white; }
    @keyframes modalIn { from { opacity:0; transform:scale(0.9) translateY(20px); } to { opacity:1; transform:scale(1) translateY(0); } }
    .modal-input { width: 100%; padding: 10px; border: 2px solid #eee; border-radius: 8px; margin-top: 10px; outline: none; }

    .nmodal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(30,42,56,0.65); display: flex; align-items: center;
        justify-content: center; z-index: 9000; backdrop-filter: blur(3px);
        animation: nmodalFadeIn 0.18s ease; padding: 16px;
    }
    @keyframes nmodalFadeIn { from { opacity:0; } to { opacity:1; } }
    .nmodal-box {
        background: white; border-radius: 18px; padding: 32px 28px 24px;
        max-width: 420px; width: 100%;
        box-shadow: 0 24px 60px rgba(0,0,0,0.22);
        animation: nmodalPop 0.25s cubic-bezier(0.34,1.56,0.64,1);
        text-align: center; position: relative;
    }
    @keyframes nmodalPop { from { opacity:0; transform:scale(0.88) translateY(16px); } to { opacity:1; transform:scale(1) translateY(0); } }
    .nmodal-icon { width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 18px; }
    .nmodal-icon.info    { background:#eaf4fd; }
    .nmodal-icon.success { background:#eafaf1; }
    .nmodal-icon.warning { background:#fef9e7; }
    .nmodal-icon.error   { background:#fdf0ef; }
    .nmodal-icon.question { background:#f0f3ff; }
    .nmodal-title   { font-size:17px; font-weight:700; color:var(--dark); margin-bottom:10px; }
    .nmodal-message { font-size:13px; color:#555; line-height:1.6; margin-bottom:24px; }
    .nmodal-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    .nmodal-btn { border:none; border-radius:9px; padding:10px 22px; font-size:13px; font-weight:600; cursor:pointer; transition:filter 0.15s,transform 0.15s; min-width:100px; }
    .nmodal-btn:hover { filter:brightness(1.08); transform:translateY(-1px); }
    .nmodal-btn.primary   { background:var(--blue); color:white; }
    .nmodal-btn.success   { background:var(--success); color:white; }
    .nmodal-btn.danger    { background:var(--absent); color:white; }
    .nmodal-btn.secondary { background:#ecf0f1; color:#555; }
    .nmodal-input { width:100%; padding:11px 14px; border:2px solid #e0e0e0; border-radius:9px; font-size:13px; outline:none; margin-bottom:20px; transition:border-color 0.2s; }
    .nmodal-input:focus { border-color:var(--blue); }
    .nmodal-input[type="password"] { letter-spacing:2px; font-size:16px; }

    #toastContainer {
        position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
        z-index:99999; display:flex; flex-direction:column; gap:8px;
        align-items:center; pointer-events:none;
    }
    .toast { display:flex; align-items:center; gap:10px; padding:12px 20px; border-radius:50px; font-size:13px; font-weight:500; box-shadow:0 6px 20px rgba(0,0,0,0.18); pointer-events:auto; animation:toastIn 0.3s cubic-bezier(0.34,1.56,0.64,1); max-width:360px; white-space:nowrap; }
    @keyframes toastIn  { from { opacity:0; transform:translateY(20px) scale(0.9); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes toastOut { from { opacity:1; transform:translateY(0) scale(1); } to { opacity:0; transform:translateY(10px) scale(0.9); } }
    .toast.info    { background:var(--dark); color:white; }
    .toast.success { background:var(--success); color:white; }
    .toast.warning { background:#f39c12; color:white; }
    .toast.error   { background:var(--absent); color:white; }


    /* ── POST-IT ────────────────────────────────────────────────── */
    .sticky-note { position:fixed; bottom:20px; right:20px; width:300px; min-width:200px; min-height:38px; background:#fff9c4; border:1px solid #fbc02d; border-radius:6px; box-shadow:0 4px 15px rgba(0,0,0,0.25); z-index:10000; display:flex; flex-direction:column; overflow:hidden; transition:box-shadow 0.2s; }
    .sticky-note:hover { box-shadow:0 6px 20px rgba(0,0,0,0.35); }
    .sticky-header { background:#fbc02d; padding:0 8px; cursor:move; font-size:12px; font-weight:bold; text-align:left; display:flex; align-items:center; justify-content:space-between; height:38px; flex-shrink:0; user-select:none; border-radius:5px 5px 0 0; }
    .sticky-header-left { display:flex; align-items:center; gap:6px; }
    .sticky-note-dot { width:8px; height:8px; border-radius:50%; background:#c0392b; display:none; flex-shrink:0; box-shadow:0 0 4px rgba(192,57,43,0.6); }
    .sticky-note-dot.visible { display:inline-block; }
    .sticky-header-actions { display:flex; align-items:center; gap:4px; }
    .sticky-header button { background:none; border:none; cursor:pointer; font-weight:bold; color:#5f4b00; font-size:14px; line-height:1; padding:2px 5px; border-radius:3px; transition:background 0.15s; }
    .sticky-header button:hover { background:rgba(0,0,0,0.12); }
    .sticky-body { display:flex; flex-direction:column; flex:1; overflow:hidden; position:relative; }
    .sticky-note.collapsed .sticky-body { display:none; }
    .sticky-note.collapsed { min-height:unset; height:auto !important; resize:none; border-radius:6px; }
    .sticky-note.collapsed .sticky-header { border-radius:5px; }
    #noteContent { flex:1; width:100%; border:none; background:transparent; padding:10px 10px 20px 10px; font-family:'Handlee','Comic Sans MS',cursive; font-size:13px; resize:none; outline:none; color:#333; line-height:1.5; overflow-y:auto; min-height:80px; }
    .sticky-resize-handle { position:absolute; bottom:0; right:0; width:18px; height:18px; cursor:nwse-resize; display:flex; align-items:flex-end; justify-content:flex-end; padding:2px; opacity:0.5; transition:opacity 0.2s; z-index:1; }
    .sticky-resize-handle:hover { opacity:1; }
    .sticky-resize-handle svg { pointer-events:none; }

    /* ── BARRE OFFLINE ──────────────────────────────────────────── */
    #offlineBanner {
        position:fixed; top:0; left:0; width:100%; z-index:99999;
        background:#c0392b; color:white; text-align:center;
        padding:10px 16px; font-size:13px; font-weight:600;
        display:flex; align-items:center; justify-content:center; gap:12px;
        box-shadow:0 2px 8px rgba(0,0,0,0.3);
    }

    /* ── MOBILE ONLY ────────────────────────────────────────────── */
    @media (max-width: 768px) {
        body { margin: 4px; font-size: 13px; }

        .container { padding: 8px; width: 100%; border-radius: 8px; }

        /* Masquer les éléments non nécessaires sur mobile */
        .top-bar .logo-mobile-hide,
        .top-bar .class-input-mobile-hide,
        .top-bar .dashboard-mobile-hide,
        .top-bar .help-mobile-hide { display: none !important; }

        /* Barre de navigation jour */
        #mobileDayNav {
            display: flex !important;
            align-items: center; gap: 8px; width: 100%;
            background: #f8f9fa; border-radius: 10px;
            padding: 8px 10px; margin-bottom: 4px;
            border: 1px solid #e0e0e0;
        }

        #mobileDatePicker {
            display: none;
            width: 100%; background: #f8f9fa;
            border-radius: 10px; padding: 12px;
            border: 1px solid #e0e0e0; margin-top: 4px;
        }

        /* Table mobile : colonnes plus larges, lignes plus hautes */
        th, td { height: 44px !important; }
        .half-day-col { width: 46px !important; font-size: 11px !important; color: #666 !important; }
        .cell-abs { font-size: 14px !important; }
        .col-main {
            width: calc(100vw - 120px) !important;
            min-width: 140px !important;
            max-width: calc(100vw - 120px) !important;
            padding-left: 8px !important;
            font-size: 12px !important;
        }

        /* Barre du haut sur mobile */
        .top-bar { padding: 8px; gap: 6px; }
        .btn-main { width: auto !important; padding: 0 10px !important; height: 36px !important; font-size: 11px !important; }

        /* Barre de recherche pleine largeur */
        .search-container { max-width: 100% !important; }

        /* Post-it plus petit sur mobile */
        .sticky-note { width: 90vw !important; right: 5vw !important; }
    }

    /* Sur PC : cacher la nav jour mobile */
    @media (min-width: 769px) {
        #mobileDayNav { display: none !important; }
        #mobileDatePicker { display: none !important; }
    }
</style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div id="modalOverlay" class="modal-overlay">
    <div class="modal">
        <h2 id="mTitle"></h2>
        <div id="mContent" class="modal-content"></div>
        <div id="mFooter" class="modal-buttons"></div>
    </div>
</div>

<div class="container">
    <div class="top-bar">
        <img src="logo-rostand.jpg" alt="Logo école" onerror="this.style.display='none'"
             class="logo-mobile-hide"
             style="height:80px; width:80px; object-fit:contain; border-radius:6px; flex-shrink:0;">

        <div class="input-group class-input-mobile-hide">
            <input type="text" id="newClassName" placeholder="Enregistrer une classe..."
                   onkeypress="if(event.key==='Enter') addClass()">
            <button class="btn-add-inline" onclick="addClass()">+</button>
        </div>

        <button id="toggleBtn" class="btn-main" onclick="toggleAllClasses()" style="background:var(--gray);">▼ Tout<br>Déplier</button>

        <div class="dropdown">
            <button class="btn-main" style="background:var(--blue)" onclick="toggleGestionMenu(event)">
                <i class="fas fa-cog"></i> Gestion ▾
            </button>
            <div id="gestionMenu" class="dropdown-content">
                <a href="javascript:void(0)" onclick="exportPDF()"><i class="fas fa-file-pdf"></i> Bilan Mensuel PDF</a>
                <a href="javascript:void(0)" onclick="saveDashboardAsPDF()"><i class="fas fa-chart-line"></i> Bilan Directeur PDF</a>
                <hr style="border:0; border-top:1px solid #eee; margin:5px 0;">
                <a href="javascript:void(0)" onclick="openVacationModal()"><i class="fas fa-umbrella-beach"></i> Configurer Vacances</a>
                <a href="javascript:void(0)" onclick="openImportModal()"><i class="fas fa-file-import"></i> Importer / Sauvegarder</a>
                <hr style="border:0; border-top:1px solid #eee; margin:5px 0;">
                <a href="javascript:void(0)" onclick="togglePasswordProtection()" id="passwordToggleBtn">
                    <i class="fas fa-lock" id="passwordToggleIcon"></i>
                    <span id="passwordToggleLabel">Protection par mot de passe</span>
                </a>
                <hr style="border:0; border-top:1px solid #eee; margin:5px 0;">
                <a href="javascript:void(0)" onclick="resetAnnualAbsences()" style="color:var(--absent)">
                    <i class="fas fa-broom"></i> Effacer toutes les absences
                </a>
                <a href="javascript:void(0)" onclick="confirmClearAll()" style="color:var(--absent); font-weight:bold;">
                    <i class="fas fa-trash-alt"></i> RESET TOTAL
                </a>
            </div>
        </div>

        <button onclick="openDashboard()" class="dashboard-mobile-hide" style="background:var(--dark); color:white; border:none; padding:8px 15px; border-radius:6px; cursor:pointer; white-space:nowrap;">
            📊 Tableau de Bord
        </button>
        <button class="btn-main help-mobile-hide" onclick="openHelpModal()" style="background:#19C3E3; border-radius:50%; width:35px; height:35px; min-width:35px; padding:0;">?</button>

        <input type="file" id="importCSV" style="display:none" accept=".csv,.txt" onchange="importCSV(event)">
        <input type="file" id="restoreInput" style="display:none" accept=".json" onchange="importJSON(event)">
        <span id="syncIndicator" class="sync-status">Initialisation...</span>

        <!-- Navigation jour (mobile uniquement) -->
        <div id="mobileDayNav" style="display:none;">
            <button onclick="goToPrevDay()" style="background:var(--dark);color:white;border:none;border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer;flex-shrink:0;">‹</button>
            <div style="flex:1;text-align:center;line-height:1.2;">
                <div id="mobileDayLabel" style="font-size:15px;font-weight:700;color:var(--dark);"></div>
                <div id="mobileDaySubLabel" style="font-size:11px;color:#888;"></div>
            </div>
            <button onclick="goToNextDay()" style="background:var(--dark);color:white;border:none;border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer;flex-shrink:0;">›</button>
            <button onclick="toggleMobileDatePicker()" style="background:var(--blue);color:white;border:none;border-radius:8px;width:34px;height:34px;font-size:15px;cursor:pointer;flex-shrink:0;">📅</button>
            <button onclick="goToToday()" style="background:var(--success);color:white;border:none;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:bold;cursor:pointer;flex-shrink:0;">Auj.</button>
        </div>

        <!-- Calendrier déroulant (mobile uniquement) -->
        <div id="mobileDatePicker">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
                <button onclick="pickerPrevMonth()" style="background:var(--dark);color:white;border:none;border-radius:6px;width:30px;height:30px;cursor:pointer;">‹</button>
                <span id="pickerMonthLabel" style="font-weight:700;font-size:13px;color:var(--dark);"></span>
                <button onclick="pickerNextMonth()" style="background:var(--dark);color:white;border:none;border-radius:6px;width:30px;height:30px;cursor:pointer;">›</button>
            </div>
            <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;margin-bottom:6px;">

    async function verifyPass(p) {
        const enc = new TextEncoder();
        const km = await crypto.subtle.importKey("raw", enc.encode(p), "PBKDF2", false, ["deriveBits"]);
        const b = await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(AUTH_CONFIG.salt),iterations:100000,hash:"SHA-256"},km,256);
        return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')===AUTH_CONFIG.hash;
    }

    // ── CHIFFREMENT AES-GCM ──────────────────────────────────────
    let _encryptionKey = null;

    async function deriveEncryptionKey(password) {
        const enc = new TextEncoder();
        const km = await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveKey"]);
        return crypto.subtle.deriveKey(
            {name:"PBKDF2",salt:enc.encode("rgpd-school-enc-v1"),iterations:200000,hash:"SHA-256"},
            km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]
        );
    }

    async function encryptData(data) {
        if (!_encryptionKey) return data;
        const enc = new TextEncoder();
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt({name:"AES-GCM",iv},_encryptionKey,enc.encode(JSON.stringify(data)));
        const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
        return {__encrypted:true,iv:toB64(iv),ct:toB64(ct)};
    }

    async function decryptData(payload) {
        if (!payload||!payload.__encrypted) return payload;
        if (!_encryptionKey) throw new Error("Clé manquante");
        const fromB64 = b64 => Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
        const plain = await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(payload.iv)},_encryptionKey,fromB64(payload.ct));
        return JSON.parse(new TextDecoder().decode(plain));
    }

    function initStickyPosition() {
        const note=document.getElementById('stickyNote');

    function setupStickyNote() {
        const note=document.getElementById('stickyNote'),header=document.getElementById('stickyHeader'),rh=document.getElementById('stickyResizeHandle');
        initStickyPosition();
        header.addEventListener('mousedown',e=>{
            if(e.target.tagName==='BUTTON')return;
            stickyDragging=true;const rect=note.getBoundingClientRect();
            stickyOffsetX=e.clientX-rect.left;stickyOffsetY=e.clientY-rect.top;
            note.style.bottom='auto';note.style.right='auto';note.style.transition='none';e.preventDefault();
        });
        rh.addEventListener('mousedown',e=>{
            stickyResizing=true;const rect=note.getBoundingClientRect();
            stickyStartX=e.clientX;stickyStartY=e.clientY;stickyStartW=rect.width;stickyStartH=rect.height;
            note.style.transition='none';e.preventDefault();e.stopPropagation();
        });
        document.addEventListener('mousemove',e=>{
            if(stickyDragging){
                const x=Math.max(0,Math.min(e.clientX-stickyOffsetX,window.innerWidth-note.offsetWidth));
                const y=Math.max(0,Math.min(e.clientY-stickyOffsetY,window.innerHeight-note.offsetHeight));
                note.style.left=x+'px';note.style.top=y+'px';
                localStorage.setItem('stickyX',x);localStorage.setItem('stickyY',y);
            }
            if(stickyResizing){
                const nw=Math.max(200,stickyStartW+(e.clientX-stickyStartX));
                const nh=Math.max(120,stickyStartH+(e.clientY-stickyStartY));
                note.style.width=nw+'px';note.style.height=nh+'px';
                localStorage.setItem('stickyW',nw);localStorage.setItem('stickyH',nh);
            }
        });
        document.addEventListener('mouseup',()=>{stickyDragging=false;stickyResizing=false;});
        header.addEventListener('touchstart',e=>{
            if(e.target.tagName==='BUTTON')return;
            stickyDragging=true;const t=e.touches[0],rect=note.getBoundingClientRect();
            stickyOffsetX=t.clientX-rect.left;stickyOffsetY=t.clientY-rect.top;
            note.style.bottom='auto';note.style.right='auto';
        },{passive:true});
        document.addEventListener('touchmove',e=>{
            if(!stickyDragging)return;const t=e.touches[0];
            note.style.left=Math.max(0,t.clientX-stickyOffsetX)+'px';
            note.style.top=Math.max(0,t.clientY-stickyOffsetY)+'px';
        },{passive:true});
        document.addEventListener('touchend',()=>{stickyDragging=false;});
    }

    function save(){clearTimeout(_saveTimer);_saveTimer=setTimeout(_doSave,1500);}

    async function _doSave(){
        if(_isSaving){_pendingSave=true;return;}

            document.getElementById('syncIndicator').innerText="⚠️ Sauvegarde annulée (données vides)";return;

    }

    // ── CALENDRIER ───────────────────────────────────────────────
    function refreshSchoolMonths(){
        schoolMonths=monthConfigs.map(conf=>{
            let days=[];let d=new Date(conf.y,conf.m,1,12);
            while(d.getMonth()===conf.m){
                const dn=d.getDate(),dow=d.getDay();
                const isWork=[1,2,4,5].includes(dow);
                const ds=`${conf.y}-${String(conf.m+1).padStart(2,'0')}-${String(dn).padStart(2,'0')}`;
                const isVac=excludedDates.some(v=>ds>=v.start&&ds<=v.end);
                if(isWork&&!isVac)days.push({num:dn,label:dayLabels[dow]});
                d.setDate(d.getDate()+1);d.setHours(12);
            }
            return{name:conf.name,days};
        });
    }

    function isDayExcluded(mIdx,dayNum){
        const conf=monthConfigs[mIdx];

            const s=new Date(r.start.replace(/-/g,'/')).setHours(12);
            const e=new Date(r.end.replace(/-/g,'/')).setHours(12);
            return ts>=s&&ts<=e;
        });
    }

    // ── STATS ÉLÈVE ──────────────────────────────────────────────
    function showStudentStats(cIdx,sIdx){
        const student=schoolData[cIdx].students[sIdx];
        let aA=0,aE=0,rowsHtml="";
        schoolMonths.forEach((m,mIdx)=>{
            let mAbs=0,mExc=0;const dim={};
            Object.keys(student.data).forEach(k=>{
                const p=k.split('-');if(p.length!==3||parseInt(p[0])!==mIdx)return;
                const dn=p[1],hd=p[2],val=student.data[k];
                if(!dim[dn])dim[dn]={};dim[dn][hd]=val;
                if(val==='A'){mAbs+=0.5;aA+=0.5;}if(val==='Exc'){mAbs+=0.5;mExc+=0.5;aA+=0.5;aE+=0.5;}
            });
            let dl=[];
            Object.keys(dim).sort((a,b)=>parseInt(a)-parseInt(b)).forEach(dn=>{
                const mv=dim[dn]['M'],av=dim[dn]['AM'];
                if(mv===av&&mv)dl.push(`${dn}${mv==='Exc'?'(exc)':''}`);
                else{if(mv)dl.push(`${dn}M${mv==='Exc'?'(exc)':''}`);if(av)dl.push(`${dn}AM${av==='Exc'?'(exc)':''}`);}
            });
            if(mAbs>0)rowsHtml+=`<tr style="border-bottom:1px solid #f2f2f2;"><td style="padding:10px;font-weight:bold;white-space:nowrap;">${m.name}</td><td style="padding:10px;text-align:center;"><b>${fmt(mAbs)}</b> <small>(${fmt(mExc)})</small></td><td style="padding:10px;color:#7f8c8d;font-size:11px;line-height:1.4;">${dl.join(', ')}</td></tr>`;
        });
        showCustomModal(`Bilan : ${student.name}`,`<div style="text-align:left;font-family:sans-serif;">
            <p style="margin-bottom:15px;color:#7f8c8d;">Classe : <b>${schoolData[cIdx].name}</b></p>
            <div style="border:1px solid #eee;border-radius:8px;overflow:hidden;background:white;">
                <table style="width:100%;border-collapse:collapse;font-size:13px;">
                    <thead><tr style="background:#f8f9fa;border-bottom:2px solid #dee2e6;"><th style="padding:12px 10px;text-align:left;">Mois</th><th style="padding:12px 10px;text-align:center;">Total (Exc)</th><th style="padding:12px 10px;text-align:left;">Détail</th></tr></thead>
                    <tbody>${rowsHtml||'<tr><td colspan="3" style="padding:30px;text-align:center;color:#95a5a6;">Aucune absence enregistrée.</td></tr>'}</tbody>
                </table>
            </div>
            <div style="margin-top:20px;padding:15px;background:#eef7ff;border-radius:8px;border-left:5px solid #3498db;display:flex;justify-content:space-between;align-items:center;">
                <div><h4 style="margin:0;color:#2c3e50;font-size:14px;">Bilan Annuel</h4><p style="margin:5px 0 0 0;font-size:1.2em;">Total : <b>${fmt(aA)}</b> jours <small>(dont ${fmt(aE)} excusés)</small></p></div>
                <div style="font-size:24px;opacity:0.2;">📊</div>
            </div>
        </div>`,"800px");
    }

    // ── RÉSUMÉ JOURNALIER ────────────────────────────────────────
    async function showDailySummary(mIdx,dNum,mName){
        let absM=[],abcAM=[],excM=[],excAM=[];
        schoolData.forEach(c=>c.students.forEach(st=>{
            const km=`${mIdx}-${dNum}-M`,kam=`${mIdx}-${dNum}-AM`;
            if(st.data[km]==='A')absM.push(`<li><b>[${c.name}]</b> ${st.name}</li>`);
            if(st.data[km]==='Exc')excM.push(`<li><b>[${c.name}]</b> ${st.name}</li>`);
            if(st.data[kam]==='A')abcAM.push(`<li><b>[${c.name}]</b> ${st.name}</li>`);
            if(st.data[kam]==='Exc')excAM.push(`<li><b>[${c.name}]</b> ${st.name}</li>`);

        await showModal({title:`📅 ${dNum} ${mName}`,content:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">

        </div>`,buttons:[{text:'Fermer',color:'var(--blue)'}]});
    }

    async function exportPDF(){
        if(activeMonth===null){showAlert("Cliquez d'abord sur un mois pour le sélectionner.",{title:"Aucun mois sélectionné",type:'warning',icon:'📅'});return;}
        const{jsPDF}=window.jspdf;const doc=new jsPDF('p','mm','a4');const mC=monthConfigs[activeMonth];
        doc.setFontSize(14);doc.text(`Bilan des Absences : ${mC.name} ${mC.y}`,14,12);
        let tableRows=[];
        [...schoolData].sort((a,b)=>a.name.localeCompare(b.name)).forEach(c=>{
            let csr=[];
            [...c.students].sort((a,b)=>a.name.localeCompare(b.name)).forEach(st=>{
                let aT=0,eT=0;const bD={};
                Object.keys(st.data).filter(k=>{const p=k.split('-');return p.length===3&&parseInt(p[0])===activeMonth;}).forEach(k=>{const p=k.split('-'),day=p[1],hd=p[2];if(!bD[day])bD[day]={};bD[day][hd]=st.data[k];});
                let details=[];
                Object.keys(bD).sort((a,b)=>parseInt(a)-parseInt(b)).forEach(day=>{
                    const mv=bD[day]['M'],av=bD[day]['AM'];
                    [mv,av].forEach(v=>{if(v==='A')aT+=0.5;if(v==='Exc'){aT+=0.5;eT+=0.5;}});
                    if(mv===av&&mv)details.push(`${day}${mv==='Exc'?'(exc)':''}`);
                    else{if(mv)details.push(`${day}M${mv==='Exc'?'(exc)':''}`);if(av)details.push(`${day}AM${av==='Exc'?'(exc)':''}`);}
                });
                if(aT>0){let d=`${fmt(aT)} j. (${details.join(', ')})`;if(eT>0)d+=` dont ${fmt(eT)} j. excusées`;csr.push([st.name,d]);}
            });
            if(csr.length>0){tableRows.push([{content:`CLASSE : ${c.name}`,colSpan:2,styles:{fillColor:[230,230,230],fontStyle:'bold'}}]);csr.forEach(r=>tableRows.push(r));}
        });
        if(tableRows.length===0){showAlert(`Aucune absence pour <b>${mC.name} ${mC.y}</b>.`,{title:"Rien à exporter",type:'info',icon:'🎉'});return;}
        doc.autoTable({startY:20,head:[['Élève','Détail des absences']],body:tableRows,theme:'grid',styles:{fontSize:8},headStyles:{fillColor:[44,62,80]}});
        doc.save(`Bilan_Mensuel_${mC.name}_${mC.y}.pdf`);showToast(`Bilan ${mC.name} téléchargé !`,'success');
    }

    const MODAL_ICONS={info:'💬',success:'✅',warning:'⚠️',error:'❌',question:'🤔',pdf:'📄',lock:'🔒'};

    function showAlert(message,opts={}){return new Promise(resolve=>{const{title='',type='info',icon,btnLabel='OK'}=opts;const ic=icon||MODAL_ICONS[type]||'💬';const o=_buildNModal(`<div class="nmodal-icon ${type}">${ic}</div>${title?`<div class="nmodal-title">${title}</div>`:''}<div class="nmodal-message">${message}</div><div class="nmodal-actions"><button class="nmodal-btn primary" id="_nalertOk">${btnLabel}</button></div>`);o.querySelector('#_nalertOk').onclick=()=>{o.remove();resolve();};o.onclick=e=>{if(e.target===o){o.remove();resolve();}};});}

    function showConfirm(message,opts={}){return new Promise(resolve=>{const{title='Confirmation',type='question',icon,labelOk='Confirmer',labelCancel='Annuler',okStyle='primary'}=opts;const ic=icon||MODAL_ICONS[type]||'🤔';const o=_buildNModal(`<div class="nmodal-icon ${type}">${ic}</div><div class="nmodal-title">${title}</div><div class="nmodal-message">${message}</div><div class="nmodal-actions"><button class="nmodal-btn secondary" id="_nconfirmNo">${labelCancel}</button><button class="nmodal-btn ${okStyle}" id="_nconfirmYes">${labelOk}</button></div>`);o.querySelector('#_nconfirmYes').onclick=()=>{o.remove();resolve(true);};o.querySelector('#_nconfirmNo').onclick=()=>{o.remove();resolve(false);};o.onclick=e=>{if(e.target===o){o.remove();resolve(false);}};});}

    function showPrompt(message,opts={}){return new Promise(resolve=>{const{title='',type='info',icon,placeholder='',defaultValue='',inputType='text',labelOk='Valider',labelCancel='Annuler'}=opts;const ic=icon||MODAL_ICONS[type]||'💬';const o=_buildNModal(`<div class="nmodal-icon ${type}">${ic}</div>${title?`<div class="nmodal-title">${title}</div>`:''}<div class="nmodal-message">${message}</div><input class="nmodal-input" id="_npromptInput" type="${inputType}" placeholder="${placeholder}" value="${defaultValue}" autocomplete="off"><div class="nmodal-actions"><button class="nmodal-btn secondary" id="_npromptNo">${labelCancel}</button><button class="nmodal-btn primary" id="_npromptOk">${labelOk}</button></div>`);const inp=o.querySelector('#_npromptInput');setTimeout(()=>inp.focus(),80);const ok=()=>{const v=inp.value;o.remove();resolve(v||null);};o.querySelector('#_npromptOk').onclick=ok;inp.addEventListener('keydown',e=>{if(e.key==='Enter')ok();if(e.key==='Escape'){o.remove();resolve(null);}});o.querySelector('#_npromptNo').onclick=()=>{o.remove();resolve(null);};});}

    function showToast(message,type='info',duration=3000){const icons={info:'💬',success:'✅',warning:'⚠️',error:'❌'};const c=document.getElementById('toastContainer');const t=document.createElement('div');t.className=`toast ${type}`;t.innerHTML=`<span>${icons[type]||'💬'}</span><span>${message}</span>`;c.appendChild(t);setTimeout(()=>{t.style.animation='toastOut 0.3s ease forwards';setTimeout(()=>t.remove(),300);},duration);}

    function _buildNModal(innerHtml){const o=document.createElement('div');o.className='nmodal-overlay';o.innerHTML=`<div class="nmodal-box">${innerHtml}</div>`;document.body.appendChild(o);return o;}

            <h3 style="color:var(--blue);border-bottom:2px solid #eee;padding-bottom:6px;font-size:14px;">⚙️ 6. Sauvegarde & Sécurité</h3>
            <p>Gestion → Importer/Sauvegarder : backup .json et restauration. Import CSV : <code>Classe;Prénom Nom</code>.</p>
            <h3 style="color:var(--blue);border-bottom:2px solid #eee;padding-bottom:6px;font-size:14px;">📌 7. Note partagée (Post-it)</h3>
            <p>Synchronisée entre tous les utilisateurs. Déplacer : glisser l'en-tête. Redimensionner : poignée ⟋. Point rouge = message présent.</p>
            <div style="background:#f0fff4;border-left:4px solid #27ae60;border-radius:6px;padding:12px 14px;margin-top:18px;"><p style="margin:0;font-weight:600;color:#27ae60;font-size:13px;">☁️ Synchronisation Cloud automatique</p><p style="margin:8px 0 0;font-size:12px;color:#444;">Toutes les modifications sont sauvegardées automatiquement. Plusieurs utilisateurs peuvent travailler simultanément.</p></div>
        </div>`,buttons:[{text:"J'ai compris ✓",color:'var(--dark)'}]});
    }

    // ── DÉTECTION MOBILE & NAVIGATION JOUR ──────────────────────
    const isMobile = () => window.innerWidth <= 768;

    let mobileSelectedDate = new Date();
    let pickerViewMonth = null;
    const JOURS_FR = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
    const MOIS_FR_LONG = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

    function getMobileDayKey() {
        const d = mobileSelectedDate;
        const idx = monthConfigs.findIndex(m => m.m === d.getMonth() && m.y === d.getFullYear());
        return idx !== -1 ? {mIdx: idx, dNum: d.getDate()} : null;
    }

    function updateMobileDayLabel() {
        const d = mobileSelectedDate;
        const today = new Date();
        const isToday_ = d.getDate()===today.getDate() && d.getMonth()===today.getMonth() && d.getFullYear()===today.getFullYear();
        const el = document.getElementById('mobileDayLabel');
        const sub = document.getElementById('mobileDaySubLabel');
        if (el) el.textContent = `${JOURS_FR[d.getDay()]} ${d.getDate()} ${MOIS_FR_LONG[d.getMonth()]} ${d.getFullYear()}`;
        if (sub) sub.textContent = isToday_ ? "📍 Aujourd'hui" : '';
    }

    window.goToToday = function() {
        mobileSelectedDate = new Date();
        updateMobileDayLabel();
        renderAll();
    };

    window.goToPrevDay = function() {
        const d = new Date(mobileSelectedDate);
        d.setDate(d.getDate() - 1);
        while (d.getDay() === 0 || d.getDay() === 3 || d.getDay() === 6) d.setDate(d.getDate() - 1);
        mobileSelectedDate = d;
        updateMobileDayLabel();
        renderAll();
    };

    window.goToNextDay = function() {
        const d = new Date(mobileSelectedDate);
        d.setDate(d.getDate() + 1);
        while (d.getDay() === 0 || d.getDay() === 3 || d.getDay() === 6) d.setDate(d.getDate() + 1);
        mobileSelectedDate = d;
        updateMobileDayLabel();
        renderAll();
    };

    window.toggleMobileDatePicker = function() {
        const picker = document.getElementById('mobileDatePicker');
        if (!picker) return;
        if (picker.style.display === 'none' || picker.style.display === '') {
            pickerViewMonth = {m: mobileSelectedDate.getMonth(), y: mobileSelectedDate.getFullYear()};
            renderPickerCalendar();
            picker.style.display = 'block';
        } else {
            picker.style.display = 'none';
        }
    };

    window.pickerPrevMonth = function() {
        let m = pickerViewMonth.m - 1, y = pickerViewMonth.y;
        if (m < 0) { m = 11; y--; }
        pickerViewMonth = {m, y};
        renderPickerCalendar();
    };

    window.pickerNextMonth = function() {
        let m = pickerViewMonth.m + 1, y = pickerViewMonth.y;
        if (m > 11) { m = 0; y++; }
        pickerViewMonth = {m, y};
        renderPickerCalendar();
    };

    function renderPickerCalendar() {
        const {m, y} = pickerViewMonth;
        const lbl = document.getElementById('pickerMonthLabel');
        if (lbl) lbl.textContent = `${MOIS_FR_LONG[m]} ${y}`;
        const container = document.getElementById('pickerDays');
        if (!container) return;
        container.innerHTML = '';
        const firstDay = new Date(y, m, 1).getDay();
        const offset = firstDay === 0 ? 6 : firstDay - 1;
        for (let i = 0; i < offset; i++) container.appendChild(document.createElement('div'));
        const daysInMonth = new Date(y, m+1, 0).getDate();
        const today = new Date();
        for (let d = 1; d <= daysInMonth; d++) {
            const date = new Date(y, m, d);
            const dow = date.getDay();
            const isWeekend = dow === 0 || dow === 3 || dow === 6;
            const mIdx = monthConfigs.findIndex(mc => mc.m === m && mc.y === y);
            const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const isVac = excludedDates.some(v => ds >= v.start && ds <= v.end);
            const isSelected = mobileSelectedDate.getDate()===d && mobileSelectedDate.getMonth()===m && mobileSelectedDate.getFullYear()===y;
            const isToday_ = today.getDate()===d && today.getMonth()===m && today.getFullYear()===y;
            const isSchoolDay = mIdx !== -1 && !isWeekend && !isVac;
            const el = document.createElement('div');
            el.textContent = d;
            el.style.cssText = `padding:5px 2px;border-radius:6px;font-size:12px;cursor:${isSchoolDay?'pointer':'default'};background:${isSelected?'var(--blue)':isToday_?'#eef7ff':'transparent'};color:${isSelected?'white':isWeekend||isVac?'#ccc':'var(--dark)'};font-weight:${isSelected||isToday_?'bold':'normal'};border:${isToday_&&!isSelected?'1px solid var(--blue)':'1px solid transparent'};opacity:${isSchoolDay?'1':'0.4'};`;
            if (isSchoolDay) {
                el.onclick = () => {
                    mobileSelectedDate = new Date(y, m, d);
                    updateMobileDayLabel();
                    document.getElementById('mobileDatePicker').style.display = 'none';
                    renderAll();
                };
            }
            container.appendChild(el);
        }
    }

    // Redimensionnement : re-render si on passe PC<->mobile
    let _lastIsMobile = isMobile();
    window.addEventListener('resize', () => {
        const nowMobile = isMobile();
        if (nowMobile !== _lastIsMobile) { _lastIsMobile = nowMobile; renderAll(); }
    });

    // ── DÉMARRAGE (déplacé après définition de showPrompt) ──────

    // ── DÉMARRAGE ────────────────────────────────────────────────
    loadFromCloud();

    function showOfflineBanner(){if(document.getElementById('offlineBanner'))return;const b=document.createElement('div');b.id='offlineBanner';b.innerHTML=`<span>⚠️ Connexion au serveur perdue — les modifications ne sont pas sauvegardées</span><button onclick="_reconnectRealtime()" style="background:white;color:#c0392b;border:none;border-radius:6px;padding:4px 12px;cursor:pointer;font-weight:bold;font-size:12px;">🔄 Reconnecter</button>`;document.body.prepend(b);document.querySelector('.container').style.marginTop='48px';}
    function hideOfflineBanner(){const b=document.getElementById('offlineBanner');if(b)b.remove();document.querySelector('.container').style.marginTop='';}

    let _realtimeChannel=null,_reconnectTimer=null;

    function _setupRealtimeChannel(){
        if(_realtimeChannel)_supabase.removeChannel(_realtimeChannel);
        _realtimeChannel=_supabase.channel('absences-realtime-index-'+Date.now())
            .on('postgres_changes',{event:'UPDATE',schema:'public',table:'absences_data'},async payload=>{
                try{const d=await decryptData(payload.new.content);if(!d||!d.schoolData)return;if(_isSaving||_pendingSave)return;schoolData=d.schoolData;excludedDates=d.excludedDates||[];if(d.sharedNote!==undefined){document.getElementById('noteContent').value=d.sharedNote;updateStickyDot(d.sharedNote);}refreshSchoolMonths();renderAll();document.getElementById('syncIndicator').innerText="✅ Synchronisé";}catch(e){console.error("Realtime decrypt error:",e);}
            })
            .on('system',{},status=>{
                if(status==='SUBSCRIBED'){hideOfflineBanner();document.getElementById('syncIndicator').innerText="✅ Connecté";clearTimeout(_reconnectTimer);}
                else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){showOfflineBanner();document.getElementById('syncIndicator').innerText="🔴 Déconnecté";clearTimeout(_reconnectTimer);_reconnectTimer=setTimeout(_reconnectRealtime,10000);}
            })
            .subscribe();
    }

    window._reconnectRealtime=async function(){
        document.getElementById('syncIndicator').innerText="🔄 Reconnexion…";clearTimeout(_reconnectTimer);
        if(_encryptionKey){try{const{data}=await _supabase.from('absences_data').select('content').eq('id',1).single();if(data){const d=await decryptData(data.content);if(d&&d.schoolData&&d.schoolData.length>0){schoolData=d.schoolData;excludedDates=d.excludedDates||[];if(d.sharedNote!==undefined){document.getElementById('noteContent').value=d.sharedNote;updateStickyDot(d.sharedNote);}refreshSchoolMonths();renderAll();}}}catch(e){console.error("Erreur rechargement:",e);}}
        _setupRealtimeChannel();
    };

    window.addEventListener('online',()=>_reconnectRealtime());
    window.addEventListener('offline',()=>showOfflineBanner());

    setInterval(async()=>{
        try{const{error}=await _supabase.from('absences_data').select('id').eq('id',1).single();if(error)throw error;if(document.getElementById('offlineBanner')){hideOfflineBanner();document.getElementById('syncIndicator').innerText="✅ Connecté";}}
        catch(e){showOfflineBanner();document.getElementById('syncIndicator').innerText="🔴 Déconnecté";}
    },45000);

    _setupRealtimeChannel();
</script>
</body>
</html>
