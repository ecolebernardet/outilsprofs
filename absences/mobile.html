<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Absences CE2–CM2</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --absent: #e74c3c;
            --excuse: #d4860b;
            --dark:   #2c3e50;
            --blue:   #3498db;
            --green:  #27ae60;
            --bg:     #eef1f5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: #2c3e50; padding-bottom: env(safe-area-inset-bottom, 20px); }

        /* ── HEADER ── */
        .header {
            background: var(--dark); color: white;
            padding: 7px 12px 6px;
            position: sticky; top: 0; z-index: 50;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }
        .header-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .header h1  { font-size: 14px; font-weight: 700; white-space: nowrap; }
        .date-btn {
            font-size: 11px; font-weight: 600;
            color: white;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 5px 10px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .date-btn:active { background: rgba(255,255,255,0.3); }
        #syncStatus { font-size: 10px; opacity: 0.85; white-space: nowrap; }

        /* ── LOGIN ── */
        #loginScreen {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100dvh;
            padding: 32px 24px; gap: 18px; background: var(--bg);
        }
        #loginScreen h2 { font-size: 22px; font-weight: 700; color: var(--dark); }
        #loginScreen p  { font-size: 13px; color: #666; text-align: center; max-width: 280px; }
        #passInput {
            width: 100%; max-width: 300px; padding: 15px;
            font-size: 22px; letter-spacing: 6px;
            border: 2px solid #ddd; border-radius: 14px;
            text-align: center; outline: none; background: white;
        }
        #passInput:focus { border-color: var(--blue); }
        #loginBtn {
            width: 100%; max-width: 300px; padding: 15px;
            background: var(--blue); color: white;
            font-size: 16px; font-weight: 700;
            border: none; border-radius: 14px; cursor: pointer;
        }
        #loginBtn:active { filter: brightness(0.88); }
        #loginError { color: var(--absent); font-size: 13px; font-weight: 600; min-height: 20px; }

        /* ── MAIN ── */
        #mainScreen { display: none; }

        /* ── STATS ── */
        .stats-banner { display: flex; background: white; border-bottom: 1px solid #d8dfe8; }
        .stat-pill {
            flex: 1; text-align: center; padding: 3px 4px;
            font-size: 9px; font-weight: 600; color: #888;
            border-right: 1px solid #eee;
        }
        .stat-pill:last-child { border-right: none; }
        .stat-pill .num { font-size: 15px; font-weight: 800; display: block; line-height: 1.2; }
        .sa .num { color: var(--absent); }
        .se .num { color: var(--excuse); }
        .sp .num { color: var(--green);  }

        /* ── GRID ── */
        .grid { display: grid; grid-template-columns: 1fr 1fr; }

        /* ── COLUMN ── */
        .col { background: white; border-right: 2px solid #c8d3de; }
        .col:last-child { border-right: none; }

        .col-header {
            background: var(--dark); color: white;
            text-align: center; padding: 5px 4px 4px;
            position: sticky; top: 50px; z-index: 40;
            border-bottom: 2px solid #4a6278;
        }
        .col-title { font-size: 14px; font-weight: 800; }
        .col-sub   { font-size: 9px; opacity: 0.6; margin-top: 1px; }
        .col-badge {
            display: inline-block; margin-top: 3px;
            border-radius: 20px; padding: 1px 8px;
            font-size: 10px; font-weight: 700;
            background: rgba(255,255,255,0.13);
        }
        .col-badge.red { background: var(--absent); }

        /* M / AM sub-header */
        .half-header {
            display: grid; grid-template-columns: 1fr 36px 36px;
            background: #dde4ec; border-bottom: 1px solid #c5cfdb;
            position: sticky; top: 104px; z-index: 39;
        }
        .hl {
            text-align: center; padding: 2px 2px;
            font-size: 9px; font-weight: 700; color: #6b7a8d;
            border-left: 1px solid #c5cfdb;
        }
        .hl-empty { background: #dde4ec; }

        /* ── STUDENT ROW : nom + M + AM sur une seule ligne ── */
        .s-block {
            display: grid;
            grid-template-columns: 1fr 36px 36px;
            align-items: stretch;
            border-bottom: 1px solid #e8ecf0;
        }
        .s-block:last-child { border-bottom: none; }

        .s-name {
            font-size: 11px; font-weight: 600;
            padding: 0 5px;
            background: #f5f7fa;
            border-right: 1px solid #e8ecf0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            color: #2c3e50;
            display: flex; align-items: center;
        }
        .cells { display: contents; }

        /* ── CELL ── */
        .cell {
            display: flex; align-items: center; justify-content: center;
            width: 36px;
            height: calc((100dvh - 220px) / 15);
            min-height: 28px;
            cursor: pointer; user-select: none;
            border-left: 1px solid #e8ecf0; font-weight: 800;
            transition: filter 0.1s;
        }
        .cell:active { filter: brightness(0.80); }

        .cell.st-none { background: #fff; }
        .cell.st-none::after { content: '–'; color: #ccd2d9; font-size: 16px; }

        .cell.st-A { background: #fdf0ef; }
        .cell.st-A::after { content: 'A'; color: var(--absent); font-size: 13px; }

        .cell.st-Exc { background: #fef8ec; }
        .cell.st-Exc::after { content: 'Exc'; color: var(--excuse); font-size: 9px; }

        /* ── SAVING DOT ── */
        .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #55efc4; display: inline-block;
            margin-left: 5px; vertical-align: middle;
        }
        .dot.saving { background: #f39c12; animation: blink .7s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

        /* ── TOAST ── */
        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(44,62,80,.92); backdrop-filter: blur(8px);
            color: white; padding: 10px 22px; border-radius: 30px;
            font-size: 13px; font-weight: 600;
            opacity: 0; transition: opacity .25s;
            pointer-events: none; z-index: 9999; white-space: nowrap;
        }
        #toast.show { opacity: 1; }

        /* ── MISC ── */
        .msg {
            grid-column: 1/-1; display: flex; align-items: center;
            justify-content: center; min-height: 200px;
            font-size: 13px; color: #999; gap: 10px;
            flex-direction: column; padding: 20px; text-align: center;
        }
        .spinner {
            width: 18px; height: 18px;
            border: 3px solid #eee; border-top-color: var(--blue);
            border-radius: 50%; animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .debug {
            background: #fff8e1; border: 1px solid #f1c40f;
            border-radius: 8px; padding: 12px 14px;
            font-size: 11px; color: #7d5a00; line-height: 1.7;
            max-width: 90vw; word-break: break-word; text-align: left;
        }
        .not-found { color: #bbb; font-style: italic; }
    </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
    <div class="header-top">
        <h1>📋 CE2–CM2 <span class="dot" id="savingDot"></span></h1>
        <button class="date-btn" id="dateBtn" onclick="openDatePicker()">
            📅 <span id="todayLabel">…</span>
        </button>
        <span id="syncStatus">…</span>
    </div>
</div>
<!-- Input date caché, déclenché par JS -->
<input type="date" id="datePicker" 
       style="position:fixed;top:-200px;left:-200px;opacity:0;pointer-events:none;width:1px;height:1px;"
       onchange="onDatePicked(this.value)">

<!-- LOGIN -->
<div id="loginScreen">
    <div style="font-size:48px">🔒</div>
    <h2>Accès protégé</h2>
    <p>Entrez le mot de passe pour accéder aux absences.</p>
    <input type="password" id="passInput" placeholder="••••••••" autocomplete="current-password">
    <button id="loginBtn" onclick="attemptLogin()">Connexion</button>
    <div id="loginError"></div>
</div>

<!-- MAIN -->
<div id="mainScreen">
    <div class="stats-banner">
        <div class="stat-pill sa"><span class="num" id="statA">0</span>Absents</div>
        <div class="stat-pill se"><span class="num" id="statE">0</span>Excusés</div>
        <div class="stat-pill sp"><span class="num" id="statP">0</span>Présents</div>
    </div>
    <div class="grid" id="grid">
        <div class="msg"><div class="spinner"></div><span>Chargement…</span></div>
    </div>
    <div style="height: max(env(safe-area-inset-bottom, 0px), 60px);"></div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════
//  CONFIG SUPABASE
// ══════════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://osxbonycajarenugqsfa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_oZNXxeJO2yNfZyzhJx3scQ_UipEH136';
const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const AUTH_CONFIG = {
    salt: "8e44ad8e44ad",
    hash: "b28af9d18cb5fedd2036c1397eeb48b0b20cf7f20b65493ea20c8173929f3d07"
};

// Nom exact de la classe dans Supabase
const CLASSE_NAME = 'CE2-CM2';

// Prénoms des CE2 — dans l'ordre alphabétique des prénoms
const CE2_PRENOMS = [
    'Aliya', 'Ariane', 'Eden', 'Elowan', 'Galise', 'Jean',
    'Maëlys', 'Matteo', 'Milan', 'Noa', 'Sirine', 'Soline',
    'Timéo', 'Victor', 'Zélie'
];

// Prénoms des CM2 — dans l'ordre alphabétique des prénoms
const CM2_PRENOMS = [
    'Célina', 'Félix', 'Lila', 'Madeline', 'Marouane',
    'Maxime', 'Mayline', 'Nino', 'Nolan', 'Roumaïssa'
];

// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
let schoolData    = [];
let excludedDates = [];
let _encKey       = null;
let saveTimer     = null;
let todayMIdx     = -1;
let todayDNum     = -1;

// ══════════════════════════════════════════════════════════════
//  MONTH CONFIG (identique à index.html)
// ══════════════════════════════════════════════════════════════
const monthConfigs = [
    {m:8,y:2025},{m:9,y:2025},{m:10,y:2025},{m:11,y:2025},
    {m:0,y:2026},{m:1,y:2026},{m:2,y:2026},{m:3,y:2026},{m:4,y:2026},{m:5,y:2026},
    {m:6,y:2026}
];

// ══════════════════════════════════════════════════════════════
//  DATE
// ══════════════════════════════════════════════════════════════
const DAYS   = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const DAYS_LONG = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MONTHS = ['jan','fév','mar','avr','mai','juin','juil','aoû','sep','oct','nov','déc'];
const MONTHS_LONG = ['janvier','février','mars','avril','mai','juin',
                     'juillet','août','septembre','octobre','novembre','décembre'];

function formatDateLabel(d) {
    return `${DAYS_LONG[d.getDay()]} ${d.getDate()} ${MONTHS_LONG[d.getMonth()]}`;
}

function applyDate(d) {
    // Met à jour todayMIdx et todayDNum selon la date choisie
    const mi = monthConfigs.findIndex(c => c.m === d.getMonth() && c.y === d.getFullYear());
    todayMIdx = mi;
    todayDNum = d.getDate();
    // Label court dans le bouton
    document.getElementById('todayLabel').textContent = formatDateLabel(d);
    // Sync le picker natif
    const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    document.getElementById('datePicker').value = iso;
}

function openDatePicker() {
    const picker = document.getElementById('datePicker');
    try {
        picker.showPicker();          // modern browsers / iOS 16+
    } catch(e) {
        picker.click();               // fallback
    }
}

function onDatePicked(val) {
    if (!val) return;
    // val = "YYYY-MM-DD"
    const [y, m, day] = val.split('-').map(Number);
    applyDate(new Date(y, m-1, day));
    renderGrid();
}

function initToday() {
    applyDate(new Date());
}

// ══════════════════════════════════════════════════════════════
//  CRYPTO
// ══════════════════════════════════════════════════════════════
async function verifyPass(p) {
    const e  = new TextEncoder();
    const km = await crypto.subtle.importKey("raw", e.encode(p), "PBKDF2", false, ["deriveBits"]);
    const b  = await crypto.subtle.deriveBits(
        {name:"PBKDF2",salt:e.encode(AUTH_CONFIG.salt),iterations:100000,hash:"SHA-256"}, km, 256);
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('') === AUTH_CONFIG.hash;
}
async function deriveKey(p) {
    const e  = new TextEncoder();
    const km = await crypto.subtle.importKey("raw", e.encode(p), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
        {name:"PBKDF2",salt:e.encode("rgpd-school-enc-v1"),iterations:200000,hash:"SHA-256"},
        km, {name:"AES-GCM",length:256}, false, ["encrypt","decrypt"]);
}
async function encData(data) {
    if (!_encKey) throw new Error('Clé de chiffrement non initialisée — sauvegarde bloquée');
    const e  = new TextEncoder();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:"AES-GCM",iv}, _encKey, e.encode(JSON.stringify(data)));
    const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
    return {__encrypted:true, iv:b64(iv), ct:b64(ct)};
}
async function decData(payload) {
    if (!payload || !payload.__encrypted) return payload;
    if (!_encKey) throw new Error("Clé manquante");
    const f     = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
    const plain = await crypto.subtle.decrypt({name:"AES-GCM",iv:f(payload.iv)}, _encKey, f(payload.ct));
    return JSON.parse(new TextDecoder().decode(plain));
}

// ══════════════════════════════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════════════════════════════
async function attemptLogin() {
    const p   = document.getElementById('passInput').value;
    const btn = document.getElementById('loginBtn');
    btn.textContent = '⏳ Vérification…'; btn.disabled = true;

    const passOff = localStorage.getItem('password_protection_disabled') === 'true';
    if (!passOff) {
        const ok = await verifyPass(p);
        if (!ok) {
            document.getElementById('loginError').textContent = '❌ Mot de passe incorrect';
            btn.textContent = 'Connexion'; btn.disabled = false;
            return;
        }
        _encKey = await deriveKey(p);
    }
    sessionStorage.setItem('m_auth','1');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display  = 'block';
    await loadData();
}
document.getElementById('passInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') attemptLogin();
});

// ══════════════════════════════════════════════════════════════
//  LOAD
// ══════════════════════════════════════════════════════════════
async function loadData() {
    setSync('🔄 Chargement…');
    try {
        const {data, error} = await _sb.from('absences_data').select('content').eq('id',1).single();
        if (error) throw error;
        const d       = await decData(data.content);
        schoolData    = d.schoolData    || [];
        excludedDates = d.excludedDates || [];
        setSync('✅ Synchronisé');
    } catch(e) {
        console.error(e);
        setSync('❌ Erreur');
        const grid = document.getElementById('grid');
        grid.innerHTML = `<div class="msg"><div class="debug">
            <b>❌ Erreur de chargement</b><br><br>
            ${e.message || String(e)}<br><br>
            <small>Rechargez la page et vérifiez le mot de passe.</small>
        </div></div>`;
        return;
    }
    const ld = document.getElementById('loading');
    if (ld) ld.remove();
    renderGrid();
    subscribeRealtime();
}

// ══════════════════════════════════════════════════════════════
//  REALTIME
// ══════════════════════════════════════════════════════════════
function subscribeRealtime() {
    _sb.channel('abs-ce2cm2-v3')
        .on('postgres_changes',
            {event:'UPDATE', schema:'public', table:'absences_data'},
            async payload => {
                if (document.getElementById('savingDot').classList.contains('saving')) return;
                try {
                    const d       = await decData(payload.new.content);
                    schoolData    = d.schoolData    || [];
                    excludedDates = d.excludedDates || [];
                    renderGrid();
                    setSync('✅ Synchronisé');
                    showToast('🔄 Données mises à jour');
                } catch(e) { console.error(e); }
            }
        ).subscribe();
}

// ══════════════════════════════════════════════════════════════
//  SAVE
// ══════════════════════════════════════════════════════════════
async function saveData() {
    document.getElementById('savingDot').classList.add('saving');
    setSync('💾 Sauvegarde…');
    try {
        // ── Étape 1 : lire les données COMPLÈTES depuis Supabase ──
        const {data, error} = await _sb.from('absences_data').select('content').eq('id',1).single();
        if (error) throw new Error('Lecture Supabase échouée : ' + error.message);

        // ── Étape 2 : déchiffrer ──
        let remote;
        try {
            remote = await decData(data.content);
        } catch(decErr) {
            throw new Error('Déchiffrement échoué — clé incorrecte ?');
        }

        const remoteSchool = remote.schoolData;

        // ── Étape 3 : vérifications de sécurité ──
        if (!Array.isArray(remoteSchool)) throw new Error('schoolData absent des données distantes');
        if (remoteSchool.length === 0)    throw new Error('0 classes dans Supabase — sauvegarde annulée');

        // Log pour diagnostic
        console.log('[mobile save] classes distantes:', remoteSchool.map(c=>c.name));

        // ── Étape 4 : trouver CE2-CM2 dans les données distantes ──
        const remoteCIdx = remoteSchool.findIndex(c => norm(c.name) === norm(CLASSE_NAME));
        if (remoteCIdx === -1) throw new Error(`"${CLASSE_NAME}" introuvable dans Supabase`);

        // ── Étape 5 : trouver CE2-CM2 dans les données locales ──
        const localCIdx = schoolData.findIndex(c => norm(c.name) === norm(CLASSE_NAME));
        if (localCIdx === -1) throw new Error(`"${CLASSE_NAME}" introuvable en local`);

        // ── Étape 6 : patch chirurgical — on ne copie QUE .data de chaque élève ──
        const remoteStudents = remoteSchool[remoteCIdx].students || [];
        const localStudents  = schoolData[localCIdx].students   || [];

        remoteStudents.forEach(rSt => {
            const lSt = localStudents.find(s => s.name === rSt.name);
            if (lSt) rSt.data = JSON.parse(JSON.stringify(lSt.data || {}));
        });

        // ── Étape 7 : reconstruire payload COMPLET et sauvegarder ──
        const payload = {
            schoolData:    remoteSchool,          // toutes les classes, CE2-CM2 patchée
            excludedDates: remote.excludedDates || [],
            sharedNote:    remote.sharedNote    || ''
        };

        // Vérification finale
        if (payload.schoolData.length < remoteSchool.length) {
            throw new Error('Incohérence détectée — sauvegarde annulée');
        }

        const encrypted = await encData(payload);
        await _sb.from('absences_data').upsert({id:1, content: encrypted});

        // ── Étape 8 : mettre à jour le local avec les données complètes ──
        schoolData    = remoteSchool;
        excludedDates = payload.excludedDates;

        console.log('[mobile save] ✅ sauvegardé,', remoteSchool.length, 'classes préservées');
        setSync('✅ Synchronisé 🔒');
        showToast('✅ Sauvegardé');

    } catch(e) {
        console.error('[mobile save] ❌', e);
        setSync('❌ ' + (e.message || 'Erreur'));
        showToast('❌ ' + (e.message || 'Erreur de sauvegarde'));
    }
    document.getElementById('savingDot').classList.remove('saving');
}
function scheduleSave() {
    clearTimeout(saveTimer);
    document.getElementById('savingDot').classList.add('saving');
    saveTimer = setTimeout(saveData, 900);
}

// ══════════════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════════════
function makeKey(hd)       { return `${todayMIdx}-${todayDNum}-${hd}`; }
function getStatus(st, hd) { return (st.data && st.data[makeKey(hd)]) || 'none'; }
function nextStatus(s)     { return s==='none' ? 'A' : s==='A' ? 'Exc' : 'none'; }
function setSync(t)        { document.getElementById('syncStatus').textContent = t; }
function showToast(msg, ms=2200) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), ms);
}

// Normalise pour comparaison (enlève accents, minuscules)
function norm(s) {
    return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}

// Cherche un élève par prénom dans la classe CE2-CM2.
// Teste chaque mot du champ name contre le prénom cible.
// Compatible avec "Prénom NOM" et "NOM Prénom".
function findByPrenom(prenom, students) {
    const target = norm(prenom);
    for (let sIdx = 0; sIdx < students.length; sIdx++) {
        const words = students[sIdx].name.split(/[\s\-]+/);
        if (words.some(w => norm(w) === target)) {
            return sIdx;
        }
    }
    return -1;
}

// ══════════════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════════════
function renderGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    // Pas de données
    if (schoolData.length === 0) {
        grid.innerHTML = `<div class="msg"><div class="debug">
            <b>⚠️ Aucune donnée reçue.</b><br>Vérifiez la connexion et rechargez.
        </div></div>`;
        return;
    }

    // Jour non configuré
    if (todayMIdx === -1) {
        grid.innerHTML = `<div class="msg">Aucun jour scolaire configuré pour aujourd'hui.</div>`;
        return;
    }

    // Trouver la classe CE2-CM2 (comparaison insensible à la casse)
    const cIdx = schoolData.findIndex(c => norm(c.name) === norm(CLASSE_NAME));

    if (cIdx === -1) {
        // Afficher les noms disponibles pour diagnostic
        const list = schoolData.map(c => `• "${c.name}"`).join('<br>');
        grid.innerHTML = `<div class="msg"><div class="debug">
            <b>⚠️ Classe "${CLASSE_NAME}" introuvable.</b><br><br>
            Classes disponibles dans Supabase :<br>${list || '(aucune)'}
        </div></div>`;
        return;
    }

    const classe   = schoolData[cIdx];
    const students = classe.students || [];

    let totalA=0, totalE=0, totalP=0;

    [
        {label:'CE2', prenoms: CE2_PRENOMS},
        {label:'CM2', prenoms: CM2_PRENOMS},
    ].forEach(({label, prenoms}) => {

        // Comptage absences pour badge
        let colAbs = 0;
        prenoms.forEach(prenom => {
            const sIdx = findByPrenom(prenom, students);
            if (sIdx === -1) return;
            ['M','AM'].forEach(hd => {
                const s = getStatus(students[sIdx], hd);
                if (s==='A' || s==='Exc') colAbs += 0.5;
            });
        });

        const col = document.createElement('div');
        col.className = 'col';

        // En-tête de colonne
        col.innerHTML = `
            <div class="col-header">
                <div class="col-title">${label}</div>
                <div class="col-sub">${prenoms.length} élèves</div>
                <span class="col-badge ${colAbs>0?'red':''}">
                    ${colAbs > 0 ? colAbs+' j abs' : '✓ tous présents'}
                </span>
            </div>
            <div class="half-header">
                <div class="hl-empty"></div>
                <div class="hl">M</div>
                <div class="hl">AM</div>
            </div>
        `;

        // Lignes élèves
        prenoms.forEach(prenom => {
            const sIdx = findByPrenom(prenom, students);
            const block = document.createElement('div');
            block.className = 's-block';

            if (sIdx === -1) {
                // Élève introuvable — affiche en grisé
                block.innerHTML = `
                    <div class="s-name not-found">${prenom} (?)</div>
                    <div class="cells">
                        <div class="cell st-none"></div>
                        <div class="cell st-none"></div>
                    </div>`;
                col.appendChild(block);
                return;
            }

            // Nom bar — affiche uniquement le prénom
            const nameBar = document.createElement('div');
            nameBar.className = 's-name';
            nameBar.textContent = prenom;
            block.appendChild(nameBar);

            // Cases M et AM
            const cellsRow = document.createElement('div');
            cellsRow.className = 'cells';

            ['M','AM'].forEach(hd => {
                const s = getStatus(students[sIdx], hd);

                if      (s === 'A')   totalA += 0.5;
                else if (s === 'Exc') totalE += 0.5;
                else                  totalP += 0.5;

                const cell = document.createElement('div');
                cell.className = `cell st-${s}`;

                cell.addEventListener('click', () => {
                    const cur = getStatus(schoolData[cIdx].students[sIdx], hd);
                    const nxt = nextStatus(cur);
                    const k   = makeKey(hd);
                    if (nxt === 'none') delete schoolData[cIdx].students[sIdx].data[k];
                    else                schoolData[cIdx].students[sIdx].data[k] = nxt;
                    renderGrid();
                    scheduleSave();
                });

                cellsRow.appendChild(cell);
            });

            block.appendChild(cellsRow);
            col.appendChild(block);
        });

        grid.appendChild(col);
    });

    // Mise à jour stats
    document.getElementById('statA').textContent = totalA;
    document.getElementById('statE').textContent = totalE;
    document.getElementById('statP').textContent = totalP;
}

// ══════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════
initToday();
// On affiche toujours l'écran de login pour reconstruire _encKey.
// Si la protection par mot de passe est désactivée, on charge directement.
if (localStorage.getItem('password_protection_disabled') === 'true') {
    (async () => {
        // Même clé par défaut que index.html quand la protection est désactivée
        _encKey = await deriveKey('no-password-default-key');
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainScreen').style.display  = 'block';
        loadData();
    })();
}
</script>
</body>
</html>
