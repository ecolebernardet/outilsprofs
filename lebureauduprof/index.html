<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le Bureau du Prof a changé d'adresse</title>
  <meta name="description" content="Le Bureau du Prof est désormais accessible sur https://lebureauduprof.fr">
  <link rel="canonical" href="https://lebureauduprof.fr/">
  <link rel="icon" href="logo.jpeg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ardoise: #1f3a34;
      --ardoise-fonce: #172c27;
      --craie: #f3f1ea;
      --craie-douce: #c9d3ce;
      --jaune: #f2c94c;
      --jaune-fonce: #d9ac22;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--ardoise);
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.06), transparent 60%);
      color: var(--craie);
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 1.125rem;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 40rem;
    }

    .logo {
      display: block;
      width: clamp(9rem, 38vw, 13rem);
      height: auto;
      aspect-ratio: 1 / 1;
      margin-bottom: 1.75rem;
      border-radius: 10px;
      box-shadow: 0 0 0 2px rgba(243, 241, 234, .25);
    }

    h1 {
      font-family: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
      font-weight: 800;
      font-size: clamp(2.1rem, 7vw, 3.4rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
    }

    .intro {
      color: var(--craie-douce);
      max-width: 34rem;
      margin-bottom: 2rem;
    }

    .adresse {
      display: block;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.75rem;
      background: var(--ardoise-fonce);
      border: 2px dashed var(--craie-douce);
      border-radius: 6px;
      color: var(--craie);
      text-decoration: none;
      font-family: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
      font-weight: 800;
      font-size: clamp(1.35rem, 5.6vw, 2.2rem);
      letter-spacing: -0.01em;
      overflow-wrap: anywhere;
      transition: border-color .2s, border-style .2s;
    }

    .adresse:hover { border-color: var(--jaune); border-style: solid; }

    .bouton {
      display: inline-block;
      padding: .85rem 1.6rem;
      background: var(--jaune);
      color: #2a2410;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      transition: background .2s;
    }

    .bouton:hover { background: var(--jaune-fonce); }

    a:focus-visible {
      outline: 3px solid var(--craie);
      outline-offset: 3px;
    }

    .note {
      margin-top: 2.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(243, 241, 234, .18);
      color: var(--craie-douce);
      font-size: 1rem;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.jpeg" width="1024" height="1024" alt="Logo du Bureau du Prof">

    <h1>Le Bureau du Prof a changé d'adresse</h1>

    <p class="intro">
      Le site n'est plus disponible sur cette page.
      Vous le retrouvez, tel que vous le connaissez, à sa nouvelle adresse :
    </p>

    <a class="adresse" href="https://lebureauduprof.fr/">https://lebureauduprof.fr</a>

    <a class="bouton" href="https://lebureauduprof.fr/">Aller sur le nouveau site</a>

    <p class="note">
      Pensez à mettre à jour vos favoris et vos liens vers Le Bureau du Prof.
    </p>
  </main>
</body>
</html>
