<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tables de Multiplication</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF8F0;
    --card: #FFFFFF;
    --primary: #FF6B35;
    --secondary: #4ECDC4;
    --accent: #FFE66D;
    --purple: #A78BFA;
    --dark: #2D2D2D;
    --text-muted: #888;
    --correct: #4ECDC4;
    --wrong: #FF6B6B;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
    --shadow-hover: 0 8px 30px rgba(0,0,0,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    color: var(--dark);
  }

  /* Background deco */
  body::before {
    content: '';
    position: fixed;
    top: -100px; right: -100px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(255,107,53,0.12), transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -80px; left: -80px;
    width: 350px; height: 350px;
    background: radial-gradient(circle, rgba(78,205,196,0.15), transparent 70%);
    pointer-events: none;
  }

  header {
    text-align: center;
    padding: 2.5rem 1rem 1.5rem;
  }
  header h1 {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: clamp(2rem, 5vw, 3.2rem);
    color: var(--primary);
    letter-spacing: -1px;
  }
  header h1 span { color: var(--secondary); }
  header p {
    color: var(--text-muted);
    font-size: 1rem;
    margin-top: 0.4rem;
  }

  /* Mode tabs */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 0.6rem;
    padding: 0 1rem 1.5rem;
    flex-wrap: wrap;
  }
  .tab {
    padding: 0.6rem 1.4rem;
    border-radius: 50px;
    border: 2.5px solid transparent;
    background: white;
    font-family: 'Baloo 2', cursive;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: var(--shadow);
  }
  .tab:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
  .tab.active { background: var(--primary); color: white; border-color: var(--primary); }

  /* Main container */
  .container { max-width: 900px; margin: 0 auto; padding: 0 1rem 3rem; }

  /* === MODE: TABLEAU === */
  .section { display: none; }
  .section.active { display: block; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .table-selector {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
    margin-bottom: 1.5rem;
  }
  .num-btn {
    width: 52px; height: 52px;
    border-radius: 14px;
    border: 2.5px solid #eee;
    background: white;
    font-family: 'Baloo 2', cursive;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .num-btn:hover { transform: scale(1.08); border-color: var(--primary); }
  .num-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

  .multiplication-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 0.7rem;
    margin-top: 1rem;
  }
  .mult-card {
    background: white;
    border-radius: 16px;
    padding: 1rem 0.8rem;
    text-align: center;
    box-shadow: var(--shadow);
    transition: all 0.2s;
    cursor: pointer;
    border: 2px solid transparent;
    position: relative;
    overflow: hidden;
  }
  .mult-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--card-color, var(--primary));
  }
  .mult-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
  .mult-card .operation { font-size: 1rem; color: var(--text-muted); font-weight: 600; }
  .mult-card .result {
    font-family: 'Baloo 2', cursive;
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--dark);
    transition: all 0.3s;
  }
  .mult-card.hidden-result .result { color: transparent; background: #eee; border-radius: 8px; }
  .mult-card.hidden-result:hover .result { color: var(--primary); background: transparent; }

  .options-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  .toggle-btn {
    padding: 0.5rem 1.2rem;
    border-radius: 50px;
    border: 2px solid var(--secondary);
    background: white;
    color: var(--secondary);
    font-family: 'Baloo 2', cursive;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.9rem;
  }
  .toggle-btn:hover, .toggle-btn.active { background: var(--secondary); color: white; }

  /* === MODE: QUIZ === */
  .quiz-wrapper {
    max-width: 500px;
    margin: 0 auto;
  }

  .quiz-config {
    background: white;
    border-radius: 24px;
    padding: 2rem;
    box-shadow: var(--shadow);
    margin-bottom: 1.5rem;
  }
  .quiz-config h3 {
    font-family: 'Baloo 2', cursive;
    font-size: 1.1rem;
    margin-bottom: 0.8rem;
    color: var(--dark);
  }

  .quiz-card {
    background: white;
    border-radius: 28px;
    padding: 2.5rem 2rem;
    box-shadow: var(--shadow);
    text-align: center;
  }

  .score-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
  }
  .score-pill {
    padding: 0.4rem 1rem;
    border-radius: 50px;
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: 0.95rem;
  }
  .score-pill.correct-score { background: rgba(78,205,196,0.15); color: var(--correct); }
  .score-pill.wrong-score { background: rgba(255,107,107,0.15); color: var(--wrong); }
  .question-count { color: var(--text-muted); font-size: 0.9rem; }

  .question-display {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(2.5rem, 8vw, 4rem);
    font-weight: 800;
    color: var(--dark);
    margin-bottom: 0.5rem;
    line-height: 1;
  }
  .question-display .eq { color: var(--primary); }

  .answer-input {
    width: 100%;
    max-width: 200px;
    padding: 1rem;
    font-size: 2rem;
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    text-align: center;
    border: 3px solid #eee;
    border-radius: 16px;
    outline: none;
    transition: border-color 0.2s;
    margin: 1rem 0;
  }
  .answer-input:focus { border-color: var(--primary); }
  .answer-input.correct { border-color: var(--correct); background: rgba(78,205,196,0.1); }
  .answer-input.wrong { border-color: var(--wrong); background: rgba(255,107,107,0.1); }

  .answer-feedback {
    height: 2rem;
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: 1.2rem;
    transition: all 0.3s;
  }
  .answer-feedback.correct { color: var(--correct); }
  .answer-feedback.wrong { color: var(--wrong); }

  .quiz-btn {
    padding: 0.9rem 2.5rem;
    border-radius: 50px;
    border: none;
    background: var(--primary);
    color: white;
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(255,107,53,0.3);
    margin-top: 1rem;
  }
  .quiz-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,53,0.4); }
  .quiz-btn:active { transform: translateY(0); }
  .quiz-btn.secondary { background: var(--secondary); box-shadow: 0 4px 15px rgba(78,205,196,0.3); }

  /* Result screen */
  .result-screen { display: none; }
  .result-screen.show { display: block; animation: fadeIn 0.4s ease; }
  .result-emoji { font-size: 4rem; margin-bottom: 1rem; }
  .result-score {
    font-family: 'Baloo 2', cursive;
    font-size: 3rem;
    font-weight: 800;
    color: var(--primary);
  }
  .result-msg { color: var(--text-muted); margin: 0.5rem 0 1.5rem; }

  /* === MODE: GRAND TABLEAU === */
  .big-table-wrapper { overflow-x: auto; }
  .big-table {
    border-collapse: separate;
    border-spacing: 3px;
    margin: 0 auto;
    min-width: 600px;
  }
  .big-table td, .big-table th {
    width: 52px; height: 52px;
    text-align: center;
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: 1rem;
    border-radius: 10px;
    transition: all 0.15s;
  }
  .big-table .header-cell {
    background: var(--primary);
    color: white;
    font-size: 1.1rem;
  }
  .big-table .data-cell {
    background: white;
    color: var(--dark);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  .big-table .data-cell:hover {
    background: var(--accent);
    transform: scale(1.08);
    z-index: 1;
    position: relative;
  }
  .big-table .data-cell.highlight-row { background: rgba(255,107,53,0.12); }
  .big-table .data-cell.highlight-col { background: rgba(78,205,196,0.15); }
  .big-table .data-cell.highlight-both { background: var(--accent); font-size: 1.2rem; }
  .big-table .corner { background: var(--dark); border-radius: 10px; }

  .table-legend {
    text-align: center;
    margin-top: 1rem;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  /* Progress bar for quiz */
  .progress-track {
    height: 6px;
    background: #eee;
    border-radius: 3px;
    margin-bottom: 2rem;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  /* Stars animation */
  @keyframes pop { 0% { transform: scale(0); opacity: 1; } 80% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .star-anim { animation: pop 0.4s ease; display: inline-block; }

  /* Confetti */
  .confetti-container {
    position: fixed;
    top: 0; left: 0; right: 0;
    pointer-events: none;
    overflow: hidden;
    height: 100vh;
    z-index: 9999;
  }
  .confetti-piece {
    position: absolute;
    width: 10px; height: 10px;
    top: -10px;
    animation: confettiFall linear forwards;
    border-radius: 2px;
  }
  @keyframes confettiFall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<header>
  <h1>Tables de <span>multiplication</span> ✖️</h1>
  <p>Pour les élèves de cycle 2 et cycle 3</p>
</header>

<div class="tabs">
  <button class="tab active" onclick="setMode('tableau')">📋 Tables</button>
  <button class="tab" onclick="setMode('quiz')">🎯 Quiz</button>
  <button class="tab" onclick="setMode('grand')">🗺️ Grand tableau</button>
</div>

<div class="container">

  <!-- MODE TABLEAU -->
  <div class="section active" id="section-tableau">
    <div style="text-align:center; margin-bottom:1rem;">
      <div class="table-selector" id="numSelector"></div>
    </div>
    <div class="options-row" style="justify-content:center;">
      <button class="toggle-btn" id="hideBtn" onclick="toggleHide()">👁️ Cacher les résultats</button>
      <button class="toggle-btn" onclick="shuffleCards()">🔀 Mélanger</button>
    </div>
    <div class="multiplication-grid" id="multGrid"></div>
  </div>

  <!-- MODE QUIZ -->
  <div class="section" id="section-quiz">
    <div class="quiz-wrapper">
      <div class="quiz-config">
        <h3>📚 Tables à réviser</h3>
        <div class="table-selector" id="quizNumSelector"></div>
        <div style="margin-top:1rem; display:flex; gap:0.7rem; flex-wrap:wrap; align-items:center;">
          <label style="font-weight:600; font-size:0.9rem;">Nombre de questions :</label>
          <select id="questionCount" style="padding:0.4rem 0.8rem; border-radius:8px; border:2px solid #eee; font-family:'Nunito',sans-serif; font-size:0.9rem;">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="30">30</option>
            <option value="50">50</option>
          </select>
          <button class="quiz-btn" onclick="startQuiz()" style="padding:0.5rem 1.2rem; font-size:0.9rem;">Commencer !</button>
        </div>
      </div>

      <div class="quiz-card" id="quizCard" style="display:none;">
        <div class="score-bar">
          <span class="score-pill correct-score">✅ <span id="correctCount">0</span></span>
          <span class="question-count" id="qCount">1 / 10</span>
          <span class="score-pill wrong-score">❌ <span id="wrongCount">0</span></span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

        <div class="question-display" id="questionDisplay">3 × 4 <span class="eq">=</span> ?</div>
        <div><input type="number" class="answer-input" id="answerInput" placeholder="?" min="0" max="200" autocomplete="off"></div>
        <div class="answer-feedback" id="feedback"></div>
        <button class="quiz-btn" id="nextBtn" onclick="nextQuestion()" style="display:none;">Question suivante →</button>
      </div>

      <div class="quiz-card result-screen" id="resultScreen">
        <div class="result-emoji" id="resultEmoji">🏆</div>
        <div class="result-score" id="resultScore">10/10</div>
        <div class="result-msg" id="resultMsg">Bravo, c'est parfait !</div>
        <button class="quiz-btn" onclick="restartQuiz()">🔄 Recommencer</button>
        <button class="quiz-btn secondary" onclick="setMode('quiz')" style="margin-left:0.5rem;">⚙️ Changer les tables</button>
      </div>
    </div>
  </div>

  <!-- GRAND TABLEAU -->
  <div class="section" id="section-grand">
    <p style="text-align:center; color:var(--text-muted); margin-bottom:1.2rem;">Survolez une case pour mettre en surbrillance la ligne et la colonne</p>
    <div class="big-table-wrapper">
      <table class="big-table" id="bigTable"></table>
    </div>
    <p class="table-legend">Tableau de 1 à 10</p>
  </div>

</div>

<div class="confetti-container" id="confettiContainer"></div>

<script>
// ===================== STATE =====================
let currentTable = 2;
let hideResults = false;
let cards = [];
let quizTables = [2,3,4,5];
let quizQuestions = [];
let quizIndex = 0;
let correctCount = 0;
let wrongCount = 0;
let totalQuestions = 10;
let quizActive = false;
let answered = false;

const COLORS = ['#FF6B35','#4ECDC4','#A78BFA','#FFE66D','#FF6B6B','#74B9FF','#FD79A8','#00CEC9','#FDCB6E','#6C5CE7'];

// ===================== INIT =====================
function init() {
  buildNumSelectors();
  renderTable(currentTable);
  buildBigTable();
}

function buildNumSelectors() {
  ['numSelector','quizNumSelector'].forEach((id, i) => {
    const el = document.getElementById(id);
    el.innerHTML = '';
    for(let n=1;n<=10;n++) {
      const btn = document.createElement('button');
      btn.className = 'num-btn' + (i===0 && n===currentTable ? ' active' : (i===1 && quizTables.includes(n) ? ' active' : ''));
      btn.textContent = n;
      const _n = n, _i = i;
      btn.onclick = () => {
        if(_i===0) { selectTable(_n); }
        else { toggleQuizTable(_n, btn); }
      };
      el.appendChild(btn);
    }
  });
}

// ===================== MODE TABLEAU =====================
function selectTable(n) {
  currentTable = n;
  document.querySelectorAll('#numSelector .num-btn').forEach((b,i) => b.classList.toggle('active', i===n-1));
  renderTable(n);
}

function renderTable(n, order) {
  const grid = document.getElementById('multGrid');
  grid.innerHTML = '';
  const arr = order || Array.from({length:10},(_,i)=>i+1);
  cards = arr;
  arr.forEach(m => {
    const card = document.createElement('div');
    card.className = 'mult-card' + (hideResults ? ' hidden-result' : '');
    card.style.setProperty('--card-color', COLORS[(n-1)%COLORS.length]);
    card.innerHTML = `<div class="operation">${n} × ${m}</div><div class="result">${n*m}</div>`;
    grid.appendChild(card);
  });
}

function toggleHide() {
  hideResults = !hideResults;
  const btn = document.getElementById('hideBtn');
  btn.classList.toggle('active', hideResults);
  btn.textContent = hideResults ? '👁️ Afficher les résultats' : '👁️ Cacher les résultats';
  document.querySelectorAll('.mult-card').forEach(c => c.classList.toggle('hidden-result', hideResults));
}

function shuffleCards() {
  const arr = Array.from({length:10},(_,i)=>i+1);
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  renderTable(currentTable, arr);
}

// ===================== MODE QUIZ =====================
function toggleQuizTable(n, btn) {
  if(quizTables.includes(n)) {
    if(quizTables.length > 1) { quizTables = quizTables.filter(x=>x!==n); btn.classList.remove('active'); }
  } else {
    quizTables.push(n); btn.classList.add('active');
  }
}

function generateQuestions(total) {
  const qs = [];
  for(let i=0;i<total;i++) {
    const a = quizTables[Math.floor(Math.random()*quizTables.length)];
    const b = Math.floor(Math.random()*10)+1;
    qs.push({a,b,answer:a*b});
  }
  return qs;
}

function startQuiz() {
  totalQuestions = parseInt(document.getElementById('questionCount').value);
  quizQuestions = generateQuestions(totalQuestions);
  quizIndex = 0; correctCount = 0; wrongCount = 0; answered = false;
  document.getElementById('quizCard').style.display = 'block';
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('correctCount').textContent = 0;
  document.getElementById('wrongCount').textContent = 0;
  quizActive = true;
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = quizQuestions[quizIndex];
  document.getElementById('questionDisplay').innerHTML = `${q.a} × ${q.b} <span class="eq">=</span> ?`;
  document.getElementById('qCount').textContent = `${quizIndex+1} / ${totalQuestions}`;
  document.getElementById('progressFill').style.width = `${(quizIndex/totalQuestions)*100}%`;
  const inp = document.getElementById('answerInput');
  inp.value = '';
  inp.className = 'answer-input';
  inp.disabled = false;
  inp.focus();
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'answer-feedback';
  document.getElementById('nextBtn').style.display = 'none';
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('answerInput').addEventListener('keydown', function(e) {
    if(e.key === 'Enter' && !answered && quizActive) checkAnswer();
    if(e.key === 'Enter' && answered) nextQuestion();
  });
});

function checkAnswer() {
  if(answered || !quizActive) return;
  const inp = document.getElementById('answerInput');
  const val = parseInt(inp.value);
  if(isNaN(val)) return;
  answered = true;
  inp.disabled = true;
  const q = quizQuestions[quizIndex];
  const fb = document.getElementById('feedback');
  if(val === q.answer) {
    correctCount++;
    document.getElementById('correctCount').textContent = correctCount;
    inp.className = 'answer-input correct';
    fb.textContent = '🌟 Bravo !';
    fb.className = 'answer-feedback correct';
  } else {
    wrongCount++;
    document.getElementById('wrongCount').textContent = wrongCount;
    inp.className = 'answer-input wrong';
    fb.textContent = `❌ La réponse était ${q.answer}`;
    fb.className = 'answer-feedback wrong';
  }
  document.getElementById('nextBtn').style.display = 'inline-block';
  if(quizIndex === totalQuestions - 1) {
    document.getElementById('nextBtn').textContent = 'Voir les résultats 🏆';
  }
}

document.addEventListener('input', function(e) {
  if(e.target.id === 'answerInput' && !answered && quizActive) {
    // Auto-check when answer length seems right
    const val = parseInt(e.target.value);
    const q = quizQuestions[quizIndex];
    if(!isNaN(val) && e.target.value.length >= String(q.answer).length) {
      setTimeout(() => { if(!answered) checkAnswer(); }, 300);
    }
  }
});

function nextQuestion() {
  quizIndex++;
  if(quizIndex >= totalQuestions) { showResult(); return; }
  showQuestion();
}

function showResult() {
  quizActive = false;
  document.getElementById('quizCard').style.display = 'none';
  const rs = document.getElementById('resultScreen');
  rs.classList.add('show');
  const score = `${correctCount}/${totalQuestions}`;
  document.getElementById('resultScore').textContent = score;
  const pct = correctCount/totalQuestions;
  let emoji, msg;
  if(pct === 1) { emoji='🏆'; msg='Parfait ! Tu es le champion des tables !'; }
  else if(pct >= 0.8) { emoji='⭐'; msg='Excellent travail, continue comme ça !'; }
  else if(pct >= 0.6) { emoji='😊'; msg='Bien joué ! Encore un peu de pratique !'; }
  else { emoji='💪'; msg='Continue à pratiquer, tu vas y arriver !'; }
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultMsg').textContent = msg;
  if(pct === 1) launchConfetti();
}

function restartQuiz() {
  document.getElementById('resultScreen').classList.remove('show');
  startQuiz();
}

// ===================== GRAND TABLEAU =====================
function buildBigTable() {
  const table = document.getElementById('bigTable');
  let html = '<tr><td class="corner"></td>';
  for(let i=1;i<=10;i++) html += `<th class="header-cell">${i}</th>`;
  html += '</tr>';
  for(let r=1;r<=10;r++) {
    html += `<tr><th class="header-cell">${r}</th>`;
    for(let c=1;c<=10;c++) {
      html += `<td class="data-cell" data-r="${r}" data-c="${c}" onmouseover="highlightCell(${r},${c})" onmouseout="clearHighlight()">${r*c}</td>`;
    }
    html += '</tr>';
  }
  table.innerHTML = html;
}

function highlightCell(r,c) {
  document.querySelectorAll('#bigTable .data-cell').forEach(td => {
    const dr = parseInt(td.dataset.r), dc = parseInt(td.dataset.c);
    td.className = 'data-cell';
    if(dr===r && dc===c) td.classList.add('highlight-both');
    else if(dr===r) td.classList.add('highlight-row');
    else if(dc===c) td.classList.add('highlight-col');
  });
}

function clearHighlight() {
  document.querySelectorAll('#bigTable .data-cell').forEach(td => td.className = 'data-cell');
}

// ===================== MODES =====================
function setMode(mode) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`section-${mode}`).classList.add('active');
  const idx = ['tableau','quiz','grand'].indexOf(mode);
  document.querySelectorAll('.tab')[idx].classList.add('active');
  if(mode === 'quiz') { document.getElementById('quizCard').style.display='none'; document.getElementById('resultScreen').classList.remove('show'); quizActive=false; }
}

// ===================== CONFETTI =====================
function launchConfetti() {
  const container = document.getElementById('confettiContainer');
  container.innerHTML = '';
  const colors = ['#FF6B35','#4ECDC4','#FFE66D','#A78BFA','#FF6B6B','#74B9FF'];
  for(let i=0;i<80;i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100+'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (1.5+Math.random()*2)+'s';
    p.style.animationDelay = (Math.random()*1)+'s';
    p.style.width = (8+Math.random()*8)+'px';
    p.style.height = (8+Math.random()*8)+'px';
    container.appendChild(p);
    setTimeout(() => p.remove(), 4000);
  }
}

// ===================== START =====================
init();
</script>
